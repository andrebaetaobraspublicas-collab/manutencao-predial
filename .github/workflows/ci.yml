name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gestaopredios_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/gestaopredios_test
      JWT_ACCESS_SECRET: ci-secret-with-at-least-thirty-two-characters
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      SEED_ADMIN_EMAIL: ci-admin@example.test
      SEED_ADMIN_PASSWORD: ci-demo-password-with-at-least-12-chars
      SEED_CONTRACT_TEST_DATA_ENABLED: "true"
      # Databases and credentials exist only in the disposable CI MySQL service.
      # They are separate from DATABASE_URL and are never loaded from deployment secrets.
      INFRA_TEST_DATABASE_URL: mysql://infra_test:infra_ci_password@127.0.0.1:3306/infra_security_test_ci
      INFRA_IMPORT_TEST_DATABASE_URL: mysql://infra_test:infra_ci_password@127.0.0.1:3306/infra_import_test_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Create isolated Infraestrutura test databases
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot --execute="CREATE DATABASE infra_security_test_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE infra_import_test_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER 'infra_test'@'%' IDENTIFIED BY 'infra_ci_password'; GRANT ALL PRIVILEGES ON infra_security_test_ci.* TO 'infra_test'@'%'; GRANT ALL PRIVILEGES ON infra_import_test_ci.* TO 'infra_test'@'%';"
          # MySQL 8.4 uses caching_sha2_password. Authenticate the disposable
          # account once through the official TLS client rather than enabling
          # unpinned RSA public-key retrieval in the application driver.
          docker exec "${{ job.services.mysql.id }}" mysql --protocol=TCP -h127.0.0.1 --ssl-mode=REQUIRED -uinfra_test -pinfra_ci_password --execute="SELECT 1" infra_security_test_ci
      - name: Verify isolated MySQL driver connections
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import mariadb from 'mariadb';
          for (const key of ['INFRA_TEST_DATABASE_URL','INFRA_IMPORT_TEST_DATABASE_URL']) {
            const uri = new URL(process.env[key]);
            let connection;
            try {
              connection = await mariadb.createConnection({host:uri.hostname,port:Number(uri.port||3306),user:decodeURIComponent(uri.username),password:decodeURIComponent(uri.password),database:uri.pathname.slice(1),timezone:'Z'});
              await connection.query('SELECT 1');
              console.log(key + ': isolated driver ready');
            } catch (error) {
              console.error(key + ': connection failed (' + String(error.code || 'unavailable') + ')');
              process.exitCode = 1;
            } finally { if (connection) await connection.end(); }
          }
          JAVASCRIPT
      - name: Prisma validate and generate
        run: |
          npm exec -w @gestaopredios/api prisma validate
          npm run prisma:generate -w @gestaopredios/api
      - name: Apply versioned migrations
        run: npm run prisma:deploy -w @gestaopredios/api
      - name: Seed fictitious portfolio twice
        run: |
          npm run prisma:seed -w @gestaopredios/api
          npm run prisma:seed -w @gestaopredios/api
      - name: Dependency security gate
        run: |
          node --test scripts/validate-dependency-audit.test.mjs
          node --test apps/api/scripts/maintenance-deploy-seed.test.mjs scripts/verify-deployment-mirror.test.mjs
          node --test scripts/hostinger/deployment-helpers.test.mjs
          node --test scripts/frontend/product-config.spec.mjs
          node --test scripts/frontend/infra-api.spec.mjs
          node --test scripts/frontend/infra-import.spec.cjs
          node --test scripts/infraestrutura/hostinger-jobs.spec.mjs
          node --test apps/api/scripts/infraestrutura-backup.spec.mjs
          mkdir -p artifacts
          npm audit --omit=dev --json > artifacts/dependency-audit.json || true
          node scripts/validate-dependency-audit.mjs artifacts/dependency-audit.json
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test -w @gestaopredios/api -- --runInBand --json --outputFile=../../artifacts/unit-tests.json
      - name: Verify global SICRO import and immutable snapshots
        run: node --test apps/api/scripts/infraestrutura-import.spec.mjs
      - name: Verify unchanged SICRO engine and Infraestrutura cloud bridge
        run: npm test -w @gestaopredios/infraestrutura
      - name: Homologation integration and volume tests
        run: npm run test:e2e -w @gestaopredios/api -- --runInBand --json --outputFile=../../artifacts/e2e-tests.json
      - name: Build
        run: npm run build
      - name: Verify Hostinger static export
        env:
          HOSTINGER_STATIC_EXPORT: "1"
        run: npm run build:web
      - name: Verify preserved OrçaPro editor and cloud bridge
        run: node --test scripts/orcapro/cloud-bridge.spec.cjs scripts/orcapro/sanitize-derived-html.spec.mjs scripts/orcapro/risk-ui.spec.cjs scripts/orcapro/manual-ui.spec.cjs
      - name: Render homologation report
        if: always()
        run: |
          node scripts/render-homologation-report.mjs artifacts
          cat artifacts/homologation-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish homologation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gp-045-homologation-${{ github.sha }}
          path: artifacts/
          retention-days: 30
