name: Promote Hostinger development runtime

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: hostinger-development-runtime
  cancel-in-progress: false

jobs:
  promote-api:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # Historical environment name: these credentials still belong exclusively
    # to gestaodepredios.com.br (development). Commercial production uses the
    # separate orcapro-production environment and a manual workflow.
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_SSH_USER }}
      API_DEPLOY_BRANCH: deploy-api
      APP_ROOT: /home/${{ vars.HOSTINGER_SSH_USER }}/domains/api.gestaodepredios.com.br/.builds/current/nodejs
      DOMAIN_ROOT: /home/${{ vars.HOSTINGER_SSH_USER }}/domains/api.gestaodepredios.com.br
      PERSISTENT_UPLOAD_ROOT: /home/${{ vars.HOSTINGER_SSH_USER }}/domains/api.gestaodepredios.com.br/storage/uploads
      READY_URL: https://api.gestaodepredios.com.br/api/v1/health/ready
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify release is the current main commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]]; then
            echo 'A newer main commit superseded this release; nothing will be promoted.' >&2
            exit 1
          fi

      - name: Configure pinned SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Preserve legacy private uploads
        run: |
          set -euo pipefail
          remote="${SSH_USER}@${SSH_HOST}"
          ssh_args=(-i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20)
          preserved=false

          for attempt in $(seq 1 8); do
            if ssh "${ssh_args[@]}" "$remote" \
              "set -eu; mkdir -p '$PERSISTENT_UPLOAD_ROOT'; for source in '$APP_ROOT/uploads' '$APP_ROOT/apps/api/uploads' '$DOMAIN_ROOT'/.builds/*/nodejs/uploads '$DOMAIN_ROOT'/.builds/*/nodejs/apps/api/uploads; do if test -d \"\$source\"; then cp -an \"\$source/.\" '$PERSISTENT_UPLOAD_ROOT/'; fi; done"; then
              preserved=true
              break
            fi
            sleep 10
          done

          if [[ "$preserved" != true ]]; then
            echo 'Could not preserve private uploads after repeated SSH attempts.' >&2
            exit 1
          fi

      - name: Trigger isolated Hostinger API build
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]]; then
            echo 'Main changed while preparing the release; nothing will be promoted.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' "$RELEASE_SHA" > apps/api/hostinger-release-sha.txt
          git add -f apps/api/hostinger-release-sha.txt
          git commit --allow-empty -m "Deploy API ${RELEASE_SHA}"
          git push --force origin "HEAD:refs/heads/${API_DEPLOY_BRANCH}"

      - name: Wait for Hostinger build
        run: |
          set -euo pipefail
          remote="${SSH_USER}@${SSH_HOST}"
          release_marker="${APP_ROOT}/apps/api/hostinger-release-sha.txt"
          ready=false
          ssh_args=(-i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=20)

          for attempt in $(seq 1 90); do
            deployed_release="$(ssh "${ssh_args[@]}" "$remote" "cat '$release_marker' 2>/dev/null || true" 2>/dev/null || true)"
            if [[ "$deployed_release" == "$RELEASE_SHA" ]]; then
              ready=true
              break
            fi
            sleep 10
          done

          if [[ "$ready" != true ]]; then
            echo 'Hostinger did not expose a build newer than the promoted commit.' >&2
            exit 1
          fi

      - name: Prepare the private environment and parsed startup wrapper
        run: |
          set -euo pipefail
          ssh_args=(-i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20)
          scp_args=(-i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20)
          remote="${SSH_USER}@${SSH_HOST}"
          helper_root="$DOMAIN_ROOT/hbuilds/incoming/runtime-${RELEASE_SHA}"
          ssh "${ssh_args[@]}" "$remote" "set -eu; test -d '$DOMAIN_ROOT/hbuilds'; mkdir -p '$helper_root'; chmod 700 '$helper_root'"
          scp "${scp_args[@]}" scripts/hostinger/deploy-common.sh scripts/hostinger/prepare-development-runtime.sh "$remote:$helper_root/"
          ssh "${ssh_args[@]}" "$remote" "bash '$helper_root/prepare-development-runtime.sh' '$DOMAIN_ROOT' '$APP_ROOT' '$RELEASE_SHA'"

      - name: Stamp release and recycle Passenger
        run: |
          set -euo pipefail
          remote="${SSH_USER}@${SSH_HOST}"
          release_file="${APP_ROOT}/apps/api/dist/release-sha.txt"
          process_pattern="^lsnode:/home/${SSH_USER}/domains/api\\.gestaodepredios\\.com\\.br/(\\.builds|hbuilds)/(cur|curr|curre|curren|current)(/.*)?$"
          ssh_args=(-i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=20)
          stamped=false

          for attempt in $(seq 1 12); do
            if ssh "${ssh_args[@]}" "$remote" \
              "printf '%s\\n' '$RELEASE_SHA' > '$release_file'; pids=\$(pgrep -u '$SSH_USER' -f '$process_pattern' || true); if [[ -n \"\$pids\" ]]; then kill -TERM \$pids; fi"; then
              stamped=true
              break
            fi
            sleep 5
          done

          if [[ "$stamped" != true ]]; then
            echo 'Could not stamp and recycle the Hostinger API runtime.' >&2
            exit 1
          fi

      - name: Verify promoted release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --show-error --max-time 15 "${READY_URL}?cb=$(date +%s)" || true)"
            actual="$(jq -r '.release // empty' <<< "$body" 2>/dev/null || true)"
            database="$(jq -r '.database // empty' <<< "$body" 2>/dev/null || true)"
            if [[ "$actual" == "$RELEASE_SHA" && "$database" == 'reachable' ]]; then
              echo "Release $RELEASE_SHA promoted and database reachable."
              exit 0
            fi
            sleep 5
          done
          echo 'The public API did not report the promoted release.' >&2
          exit 1
