name: Promote OrçaPro commercial production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main commit SHA with successful push CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: hostinger-orcapro-commercial-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: orcapro-production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_SSH_USER }}
      API_DOMAIN: ${{ vars.HOSTINGER_API_DOMAIN }}
      WEB_DOMAIN: ${{ vars.HOSTINGER_WEB_DOMAIN }}
      READY_URL: ${{ vars.HOSTINGER_READY_URL }}
      WEB_BASE_URL: ${{ vars.HOSTINGER_WEB_BASE_URL }}
      PUBLIC_API_URL: ${{ vars.HOSTINGER_PUBLIC_API_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.HOSTINGER_PUBLIC_API_URL }}
      NEXT_PUBLIC_ORCAPRO_ONLY: 'true'
      NEXT_PUBLIC_MARKETING_URL: https://orcaproobras.com.br/
      HOSTINGER_STATIC_EXPORT: '1'
      DATABASE_URL: mysql://build:unused@127.0.0.1:3306/compile_only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate the selected release and isolated production configuration
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Use a full lowercase commit SHA.' >&2; exit 1; }
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_PORT" =~ ^[0-9]{1,5}$ && "$SSH_USER" =~ ^u[0-9]+$ ]] || { echo 'Invalid production SSH configuration.' >&2; exit 1; }
          [[ "$API_DOMAIN" == 'api.orcaproobras.com.br' && "$WEB_DOMAIN" == 'sistema.orcaproobras.com.br' ]] || { echo 'Invalid commercial production domains.' >&2; exit 1; }
          [[ "$READY_URL" == "https://${API_DOMAIN}/api/v1/health/ready" && "$WEB_BASE_URL" == "https://${WEB_DOMAIN}" && "$PUBLIC_API_URL" == "https://${API_DOMAIN}/api/v1" ]] || { echo 'Production URLs do not match the configured domains.' >&2; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo 'Selected release is not a main commit.' >&2; exit 1; }
          passed="$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&branch=main&event=push&status=success&per_page=100" --jq "[.workflow_runs[] | select(.head_sha == \"${RELEASE_SHA}\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\")] | length")"
          [[ "$passed" -ge 1 ]] || { echo 'No successful main push CI for the exact release.' >&2; exit 1; }
          git show "${RELEASE_SHA}:apps/api/package.json" | jq -e '.scripts["hostinger:deploy"] | contains("maintenance:deploy-seed")' >/dev/null || { echo 'Selected release predates safe restored-database deployment.' >&2; exit 1; }
          git cat-file -e "${RELEASE_SHA}:scripts/hostinger/promote-api-release.sh" || { echo 'Selected release predates the SSH deployment contract.' >&2; exit 1; }
          git checkout --detach "$RELEASE_SHA"
          echo "RELEASE_ID=${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "API_ROOT=/home/${SSH_USER}/domains/${API_DOMAIN}" >> "$GITHUB_ENV"
          echo "WEB_ROOT=/home/${SSH_USER}/domains/${WEB_DOMAIN}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build and validate both artifacts before loading deployment secrets
        run: |
          set -euo pipefail
          npm ci
          npm run build:api
          npm run build:web
          printf '%s\n' "$RELEASE_SHA" > apps/web/out/hostinger-release-sha.txt
          jq -e --arg api "$PUBLIC_API_URL" '.apiBase == $api' apps/web/out/orcapro-legacy/manifest.json >/dev/null
          source_root="$RUNNER_TEMP/orcapro-source-${RELEASE_ID}"
          artifact_root="$RUNNER_TEMP/orcapro-artifacts-${RELEASE_ID}"
          mkdir "$source_root" "$artifact_root"
          git archive "$RELEASE_SHA" | tar --extract --directory "$source_root"
          mkdir -p "$source_root/apps/api/dist"
          cp -a apps/api/dist/. "$source_root/apps/api/dist/"
          tar --create --gzip --file "$artifact_root/api-source.tar.gz" --directory "$source_root" .
          tar --create --gzip --file "$artifact_root/frontend.tar.gz" --directory apps/web/out .
          python3 scripts/hostinger/verify-deployment-archive.py "$artifact_root/api-source.tar.gz"
          python3 scripts/hostinger/verify-deployment-archive.py "$artifact_root/frontend.tar.gz"
          echo "API_ARTIFACT_SHA256=$(sha256sum "$artifact_root/api-source.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "WEB_ARTIFACT_SHA256=$(sha256sum "$artifact_root/frontend.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Configure pinned production SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Production SSH secrets are missing.' >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload private deployment artifacts
        run: |
          set -euo pipefail
          remote="${SSH_USER}@${SSH_HOST}"
          ssh_args=(-i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          scp_args=(-i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" "$remote" "set -eu; test -f '$API_ROOT/hbuilds/config/.env'; test -d '$WEB_ROOT/hbuilds'; mkdir -p '$API_ROOT/hbuilds/incoming/$RELEASE_ID' '$WEB_ROOT/hbuilds/incoming/$RELEASE_ID'; chmod 700 '$API_ROOT/hbuilds/incoming/$RELEASE_ID' '$WEB_ROOT/hbuilds/incoming/$RELEASE_ID'"
          artifact_root="$RUNNER_TEMP/orcapro-artifacts-${RELEASE_ID}"
          scp "${scp_args[@]}" "$artifact_root/api-source.tar.gz" scripts/hostinger/deploy-common.sh scripts/hostinger/promote-api-release.sh scripts/hostinger/promote-web-release.sh scripts/hostinger/verify-deployment-archive.py "$remote:$API_ROOT/hbuilds/incoming/$RELEASE_ID/"
          scp "${scp_args[@]}" "$artifact_root/frontend.tar.gz" "$remote:$WEB_ROOT/hbuilds/incoming/$RELEASE_ID/frontend.tar.gz"

      - name: Build and activate only the private production API
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "${SSH_USER}@${SSH_HOST}" \
            "bash '$API_ROOT/hbuilds/incoming/$RELEASE_ID/promote-api-release.sh' '$API_ROOT' '$RELEASE_SHA' '$RELEASE_ID' '$API_ROOT/hbuilds/incoming/$RELEASE_ID/api-source.tar.gz' '$API_ARTIFACT_SHA256'"

      - name: Verify production API and database before publishing the frontend
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --show-error --max-time 15 "${READY_URL}?cb=$(date +%s)" || true)"
            if jq -e --arg sha "$RELEASE_SHA" '.release == $sha and .database == "reachable" and .readiness == "ready"' <<< "$body" >/dev/null 2>&1; then ready=true; break; fi
            sleep 5
          done
          [[ "$ready" == true ]] || { echo 'The production API did not report the selected release and reachable database. Previous runtime is preserved; frontend was not promoted.' >&2; exit 1; }
          echo "API ${RELEASE_SHA} is ready. Frontend promotion waits up to ten minutes for its static-provider marker." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for managed static frontend and activate its artifact
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "${SSH_USER}@${SSH_HOST}" \
            "bash '$API_ROOT/hbuilds/incoming/$RELEASE_ID/promote-web-release.sh' '$WEB_ROOT' '$RELEASE_SHA' '$RELEASE_ID' '$WEB_ROOT/hbuilds/incoming/$RELEASE_ID/frontend.tar.gz' '$WEB_ARTIFACT_SHA256'"

      - name: Verify production frontend marker and cloud editor origin
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            marker="$(curl --fail --silent --show-error --max-time 15 "${WEB_BASE_URL}/hostinger-release-sha.txt?cb=$(date +%s)" || true)"
            manifest="$(curl --fail --silent --show-error --max-time 15 "${WEB_BASE_URL}/orcapro-legacy/manifest.json?cb=$(date +%s)" || true)"
            if [[ "$marker" == "$RELEASE_SHA" ]] && jq -e --arg api "$PUBLIC_API_URL" '.apiBase == $api' <<< "$manifest" >/dev/null 2>&1; then ready=true; break; fi
            sleep 5
          done
          [[ "$ready" == true ]] || { echo 'Production frontend release or API origin did not match. Previous document root is preserved.' >&2; exit 1; }
          curl --fail --silent --show-error --max-time 15 "${WEB_BASE_URL}/login/?next=/orcapro" -o /dev/null
          echo "Production API and frontend promoted to ${RELEASE_SHA}. Previous private runtime and document root are preserved." >> "$GITHUB_STEP_SUMMARY"
