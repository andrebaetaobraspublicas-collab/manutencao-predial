<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Manutenção Predial</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #2c3e50;
            --cor-acento: #3498db;
            --cor-borda: #e2e8f0;
            --cor-texto: #1e293b;
            --cor-texto-suave: #64748b;
            --cor-perigo: #dc2626;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif; margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            padding: 20px; color: var(--cor-texto);
        }
        .login-card {
            background: #fff; width: 100%; max-width: 410px; border-radius: 14px;
            box-shadow: 0 18px 50px rgba(0,0,0,.25); padding: 40px 34px; animation: surge .35s ease;
        }
        @keyframes surge { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        .brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 6px; }
        .brand svg { flex: none; }
        .brand h1 { font-size: 1.25em; margin: 0; color: var(--cor-primaria); }
        .sub { text-align: center; color: var(--cor-texto-suave); font-size: .92em; margin: 0 0 26px; }
        label { display: block; font-weight: 500; margin-bottom: 6px; font-size: .9em; color: #334155; }
        .field { margin-bottom: 18px; }
        input {
            width: 100%; padding: 12px 14px; border: 1px solid var(--cor-borda); border-radius: 8px;
            font-size: 1em; font-family: inherit; transition: border-color .2s, box-shadow .2s;
        }
        input:focus { outline: none; border-color: var(--cor-acento); box-shadow: 0 0 0 3px rgba(52,152,219,.15); }
        button {
            width: 100%; padding: 13px; border: none; border-radius: 8px; cursor: pointer;
            background: var(--cor-primaria); color: #fff; font-size: 1.05em; font-weight: 700;
            font-family: inherit; transition: background .2s, transform .1s; margin-top: 4px;
        }
        button:hover { background: #1f2d3d; }
        button:active { transform: translateY(1px); }
        .erro {
            background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; border-radius: 8px;
            padding: 10px 14px; font-size: .9em; margin-bottom: 18px; text-align: center;
        }
        .foot { text-align: center; margin-top: 22px; font-size: .8em; color: var(--cor-texto-suave); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg>
            <h1>Manutenção Predial</h1>
        </div>
        <p class="sub">Acesse com suas credenciais</p>

        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}

        <form method="POST" action="/login">
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu.email@orgao.gov" required autofocus>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
            </div>
            <button type="submit">Entrar</button>
        </form>

        <p class="foot">Sistema de Gestão de Manutenção Predial</p>
    </div>
</body>
</html>
